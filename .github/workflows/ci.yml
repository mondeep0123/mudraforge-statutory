name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Zero Dependency Audit
        run: npm audit --audit-level=high

      - name: Verify Cryptographic Manifest Integrity
        run: node scripts/generate_manifest.js --check

      - name: Validate OKF Schemas & Circulars
        run: node scripts/validate_okf.js

      - name: Verify Deep Citation Integrity
        run: node scripts/verify_citation_links.js

      - name: Run OKF Conformance Test Suite
        run: node conformance/test_conformance.js

      - name: Lint Package Exports (publint)
        run: npx --yes publint

      - name: Verify TypeScript Export Resolution (attw)
        run: npx --yes @arethetypeswrong/cli --pack . --profile esm-only

      - name: Generate and Verify Corpus Quality Card
        run: node scripts/corpus_quality_report.js

      - name: Verify End-to-End AP Execution Trace
        run: node examples/simulate_end_to_end_trace.js

      - name: Run Multi-Domain Regression Test Suite
        run: node test.js
