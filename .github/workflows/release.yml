name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to NPM and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Run Prepublish Supply-Chain Gate
        run: node scripts/prepublish_gate.js

      - name: Package Distribution Tarball
        run: |
          npm pack
          sha256sum *.tgz > checksums.sha256

      - name: Publish to NPM with Sigstore Provenance
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @mudraforge/statutory version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published on npm registry. Skipping duplicate publish."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: MudraForge Statutory ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            *.tgz
            checksums.sha256
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
