name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to NPM and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Run Prepublish Supply-Chain Gate
        run: node scripts/prepublish_gate.js

      - name: Package Distribution Tarball
        run: |
          npm pack
          sha256sum *.tgz > checksums.sha256

      - name: Publish to NPM with Sigstore Provenance
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef299c7d8760 # v2.0.8
        with:
          name: MudraForge Statutory ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            *.tgz
            checksums.sha256
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
